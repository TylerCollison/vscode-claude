model_list:
  # =========================================================================
  # 1) UNDERLYING MODELS (DEPLOYMENTS)
  # =========================================================================

  # --- Google AI Studio Models ---
  # Note: all of the models from this provider respond quickly
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0

  - model_name: gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0

  - model_name: gemini-embedding-2
    litellm_params:
      model: gemini/gemini-embedding-2
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0

  - model_name: gemini-embedding-001
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0

  # --- Cerebras Models ---
  # Note: all of the models from this provider respond very slowly
  - model_name: zai-glm-4.7
    litellm_params:
      model: cerebras/zai-glm-4.7
      api_key: os.environ/CEREBRAS_API_KEY
      stream_timeout: 30.0

  # --- Nvidia NIM Models ---
  # Note: All of the models from this provider respond rather slowly
  - model_name: minimaxai/minimax-m3
    litellm_params:
      model: nvidia_nim/minimaxai/minimax-m3
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0

  - model_name: moonshotai/kimi-k2.6
    litellm_params:
      model: nvidia_nim/moonshotai/kimi-k2.6
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0

  - model_name: deepseek-ai/deepseek-v4-flash
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-flash
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0

  - model_name: deepseek-ai/deepseek-v4-pro
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0

  - model_name: z-ai/glm-5.1
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.1
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0

  - model_name: nvidia/nv-embed-v1
    litellm_params:
      model: nvidia_nim/nvidia/nv-embed-v1
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0

  # --- OpenAI Compatible (OpenCode Zen) ---
  # Note: All of the models from this provider respond very quickly
  - model_name: nemotron-3-ultra-free
    litellm_params:
      model: openai/nemotron-3-ultra-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0

  - model_name: big-pickle
    litellm_params:
      model: openai/big-pickle
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0

  - model_name: deepseek-v4-flash-free
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0

  # --- Mistral Models ---
  # Note: all of the models from this provider respond quickly
  - model_name: mistral-medium-latest
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY
      stream_timeout: 30.0

  - model_name: mistral-large-latest
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
      stream_timeout: 30.0

  - model_name: mistral-embed
    litellm_params:
      model: mistral/mistral-embed
      api_key: os.environ/MISTRAL_API_KEY
      stream_timeout: 30.0

  # =========================================================================
  # 2) UNIFIED ROUTER (THREE-STAGE PIPELINE)
  # =========================================================================
  #
  # "lite-llm/router" is a single endpoint that pipelines three routing
  # stages:
  #
  #   1. Content-based  (callback)        → lite-llm/image
  #   2. Semantic       (auto_router_1)   → lite-llm/webSearch  if web intent
  #   3. Complexity     (complexity_router)  → lite-llm/default or lite-llm/think
  #
  # The callback only handles image detection; it then delegates to
  # lite-llm/semantic-router, which checks web-search utterances and
  # falls back to lite-llm/complexity (the complexity router) for the
  # final stage — both are native LiteLLM routers.

  - model_name: lite-llm/router
    litellm_params:
      # The callback (router_callback.py) intercepts every request and
      # rewrites the model to lite-llm/image (if images present) or
      # lite-llm/semantic-router (for all other requests).
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0

  - model_name: lite-llm/gemini-embedding-2-semantic-router
    litellm_params:
      model: auto_router/auto_router_1
      auto_router_config_path: /lite-llm/gemini-embedding-2-semantic-router.json
      # Requests that don't match a web-search utterance cascade to
      # lite-llm/complexity for LiteLLM's built-in complexity routing.
      auto_router_default_model: lite-llm/complexity
      auto_router_embedding_model: gemini-embedding-2
      stream_timeout: 30.0

  - model_name: lite-llm/gemini-embedding-1-semantic-router
    litellm_params:
      model: auto_router/auto_router_1
      auto_router_config_path: /lite-llm/gemini-embedding-1-semantic-router.json
      # Requests that don't match a web-search utterance cascade to
      # lite-llm/complexity for LiteLLM's built-in complexity routing.
      auto_router_default_model: lite-llm/complexity
      auto_router_embedding_model: gemini-embedding-001
      stream_timeout: 30.0

  - model_name: lite-llm/mistral-embedding-semantic-router
    litellm_params:
      model: auto_router/auto_router_1
      auto_router_config_path: /lite-llm/mistral-embedding-semantic-router.json
      # Requests that don't match a web-search utterance cascade to
      # lite-llm/complexity for LiteLLM's built-in complexity routing.
      auto_router_default_model: lite-llm/complexity
      auto_router_embedding_model: mistral-embed
      stream_timeout: 30.0

  - model_name: lite-llm/nvidia-embedding-semantic-router
    litellm_params:
      model: auto_router/auto_router_1
      auto_router_config_path: /lite-llm/nvidia-embedding-semantic-router.json
      # Requests that don't match a web-search utterance cascade to
      # lite-llm/complexity for LiteLLM's built-in complexity routing.
      auto_router_default_model: lite-llm/complexity
      auto_router_embedding_model: nvidia/nv-embed-v1
      stream_timeout: 30.0

  - model_name: lite-llm/complexity
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: lite-llm/default
          MEDIUM: lite-llm/default
          COMPLEX: lite-llm/think
          REASONING: lite-llm/think
      complexity_router_default_model: lite-llm/default
      stream_timeout: 30.0

  # =========================================================================
  # 3) ENTRYPOINT MODEL GROUPS (THE NAMES CLIENTS WILL CALL)
  # =========================================================================

  - model_name: lite-llm/default
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0

  - model_name: lite-llm/background
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0

  - model_name: lite-llm/think
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0

  - model_name: lite-llm/longContext
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0

  - model_name: lite-llm/webSearch
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0

  - model_name: lite-llm/image
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0

litellm_settings:
  # Fixes a bug in translating between an Anthropic client and an OpenAI provider
  use_chat_completions_url_for_anthropic_messages: true

  # Content-aware callback: detects images and routes to lite-llm/image.
  # All other requests are forwarded to lite-llm/semantic-router, which
  # uses LiteLLM's built-in auto_router for web-search intent detection
  # and complexity scoring.  The module is loaded relative to this file.
  callbacks: ["router_callback.router_handler", "websearch_interception"]
  websearch_interception_params:
    enabled_providers:
      - openai
      - gemini
      - nvidia_nim
      - mistral
      - cerebras
    search_tool_name: exa-search

search_tools:
  - search_tool_name: exa-search
    litellm_params:
      search_provider: exa_ai
      api_key: os.environ/EXA_API_KEY

router_settings:
  retry_policy:
    # Set all retries to 0 to prioritize use of the fallback models
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 0
    RateLimitErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    InternalServerErrorRetries: 0

  # Documented format: List[Dict[str, List[str]]]
  fallbacks:
    - {"lite-llm/router": ["deepseek-v4-flash-free", "gemini-3.5-flash", "gemini-3-flash-preview", "gemini-2.5-flash", "zai-glm-4.7", "nemotron-3-ultra-free", "mistral-medium-latest", "big-pickle", "deepseek-ai/deepseek-v4-flash", "moonshotai/kimi-k2.6", "minimaxai/minimax-m3"]}
    - {"lite-llm/default": ["deepseek-v4-flash-free", "gemini-3.5-flash", "gemini-3-flash-preview", "gemini-2.5-flash", "zai-glm-4.7", "nemotron-3-ultra-free", "mistral-medium-latest", "big-pickle", "deepseek-ai/deepseek-v4-flash", "moonshotai/kimi-k2.6", "minimaxai/minimax-m3"]}
    - {"lite-llm/think": ["deepseek-ai/deepseek-v4-pro", "z-ai/glm-5.1", "minimaxai/minimax-m3", "moonshotai/kimi-k2.6", "nemotron-3-ultra-free", "deepseek-v4-flash-free", "deepseek-ai/deepseek-v4-flash", "gemini-3.5-flash", "gemini-3-flash-preview", "gemini-2.5-flash", "zai-glm-4.7", "mistral-large-latest", "big-pickle"]}
    - {"lite-llm/longContext": ["deepseek-ai/deepseek-v4-pro", "minimaxai/minimax-m3", "nemotron-3-ultra-free", "deepseek-v4-flash-free", "deepseek-ai/deepseek-v4-flash", "gemini-3.5-flash", "gemini-3-flash-preview", "gemini-2.5-flash"]}
    - {"lite-llm/webSearch": ["gemini-3-flash-preview", "gemini-2.5-flash", "nemotron-3-ultra-free", "big-pickle", "zai-glm-4.7", "deepseek-v4-flash-free", "mistral-medium-latest", "deepseek-ai/deepseek-v4-flash", "moonshotai/kimi-k2.6", "minimaxai/minimax-m3"]}
    - {"lite-llm/image": ["gemini-3.5-flash", "gemini-3-flash-preview", "gemini-2.5-flash", "moonshotai/kimi-k2.6", "minimaxai/minimax-m3", "deepseek-v4-flash-free", "deepseek-ai/deepseek-v4-flash"]}
    - {"lite-llm/complexity": ["deepseek-v4-flash-free", "gemini-3.5-flash", "gemini-3-flash-preview", "gemini-2.5-flash", "zai-glm-4.7", "nemotron-3-ultra-free", "mistral-medium-latest", "big-pickle", "deepseek-ai/deepseek-v4-flash", "moonshotai/kimi-k2.6", "minimaxai/minimax-m3"]}
    - {"lite-llm/gemini-embedding-2-semantic-router": ["lite-llm/gemini-embedding-1-semantic-router", "lite-llm/mistral-embedding-semantic-router", "lite-llm/nvidia-embedding-semantic-router", "lite-llm/complexity"]}