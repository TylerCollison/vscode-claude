[pytest]
# Repo-wide test suite:
#   tests/       - tests for top-level scripts (mr_pr_dispatch, beads-dispatch)
#   cconx/tests/ - test suite for the cconx package
# cconx/conftest.py mocks the docker module and puts the repo root on
# sys.path, so these run without a Docker daemon from any working directory.
testpaths = tests cconx/tests
