  # - model_name: mimo-v2.5-free
  #   litellm_params:
  #     model: openai/mimo-v2.5-free
  #     api_base: https://opencode.ai/zen/v1
  #     api_key: os.environ/OPENCODE_ZEN_API_KEY
  #     stream_timeout: 30.0
  #     timeout: 180.0
  #     extra_headers:
  #       User-Agent: opencode/1.18.16

  # - model_name: muse-spark-1.2-contributor-free
