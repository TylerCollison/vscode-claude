model_list:
  # =========================================================================
  # 1) UNDERLYING MODELS (DEPLOYMENTS)
  # =========================================================================

  # --- Google AI Studio Models ---
  # Note: all of the models from this provider respond quickly
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  # --- Nvidia NIM Models ---
  # Note: All of the models from this provider respond rather 
  - model_name: moonshotai/kimi-k3
    litellm_params:
      model: nvidia_nim/moonshotai/kimi-k3
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: deepseek-ai/deepseek-v4-pro-0813
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro-0813
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: deepseek-ai/deepseek-v4-flash-0731
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-flash-0731
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  # --- OpenAI Compatible (OpenCode Zen) ---
  # Note: All of the models from this provider respond very quickly
  - model_name: nemotron-3-ultra-free
    litellm_params:
      model: openai/nemotron-3-ultra-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: mimo-v2.5-free
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: muse-spark-1.2-contributor-free
    litellm_params:
      model: openai/muse-spark-1.2-contributor-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: big-pickle
    litellm_params:
      model: openai/big-pickle
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  # --- Mistral Models ---
  # Note: all of the models from this provider respond quickly
  - model_name: mistral-medium-latest
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: mistral-large-latest
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  # =========================================================================
  # 2) UNIFIED ROUTER (TWO-STAGE PIPELINE)
  # =========================================================================
  #
  # "lite-llm/router" is a single endpoint that pipelines two routing
  # stages:
  #
  #   1. Content-based  (callback)        → lite-llm/image
  #   2. Complexity     (complexity_router)  → lite-llm/default or lite-llm/think
  #

  - model_name: lite-llm/router
    litellm_params:
      # The callback (router_callback.py) intercepts every request and
      # rewrites the model
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: lite-llm/complexity
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: lite-llm/default
          MEDIUM: lite-llm/default
          COMPLEX: lite-llm/think
          REASONING: lite-llm/think
      complexity_router_default_model: lite-llm/default
      stream_timeout: 30.0
      timeout: 180.0

  # =========================================================================
  # 3) ENTRYPOINT MODEL GROUPS (THE NAMES CLIENTS WILL CALL)
  # =========================================================================

  - model_name: lite-llm/default
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-flash-0731
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: lite-llm/think
    litellm_params:
      model: nvidia_nim/moonshotai/kimi-k3
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: lite-llm/longContext
    litellm_params:
      model: nvidia_nim/moonshotai/kimi-k3
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: lite-llm/webSearch
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  - model_name: lite-llm/image
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

litellm_settings:
  modify_params: true
  drop_params: true
  stream: false

  callbacks: ["router_callback.router_handler", "websearch_interception"]
  websearch_interception_params:
    enabled_providers:
      - openai
      - gemini
      - nvidia_nim
      - mistral
      - cerebras
    search_tool_name: exa-search

search_tools:
  - search_tool_name: exa-search
    litellm_params:
      search_provider: exa_ai
      api_key: os.environ/EXA_API_KEY

router_settings:
  retry_policy:
    # Set all retries to 0 to prioritize use of the fallback models
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 0
    RateLimitErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    InternalServerErrorRetries: 0

  allowed_fails: 1
  num_retries: 0
  request_timeout: 30.0
  timeout: 180
  fallbacks: [{"lite-llm/router": ["muse-spark-1.2-contributor-free", "nemotron-3-ultra-free", "mimo-v2.5-free", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "moonshotai/kimi-k3", "mistral-medium-latest", "big-pickle"]}, {"lite-llm/default": ["muse-spark-1.2-contributor-free", "nemotron-3-ultra-free", "mimo-v2.5-free", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "moonshotai/kimi-k3", "mistral-medium-latest", "big-pickle"]}, {"lite-llm/think": ["deepseek-ai/deepseek-v4-pro-0813", "muse-spark-1.2-contributor-free", "nemotron-3-ultra-free", "deepseek-ai/deepseek-v4-flash-0731", "mimo-v2.5-free", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "mistral-large-latest", "mistral-medium-latest", "big-pickle"]}, {"lite-llm/longContext": ["deepseek-ai/deepseek-v4-pro-0813", "muse-spark-1.2-contributor-free", "nemotron-3-ultra-free", "deepseek-ai/deepseek-v4-flash-0731", "mimo-v2.5-free", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]}, {"lite-llm/webSearch": ["gemini-3.1-flash-lite", "muse-spark-1.2-contributor-free", "mimo-v2.5-free", "nemotron-3-ultra-free", "deepseek-ai/deepseek-v4-flash-0731", "mistral-medium-latest", "big-pickle"]}, {"lite-llm/image": ["gemini-3.1-flash-lite", "muse-spark-1.2-contributor-free", "mimo-v2.5-free"]}, {"lite-llm/complexity": ["muse-spark-1.2-contributor-free", "nemotron-3-ultra-free", "mimo-v2.5-free", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "moonshotai/kimi-k3", "mistral-medium-latest", "big-pickle"]}]