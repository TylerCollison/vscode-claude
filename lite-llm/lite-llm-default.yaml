  #     api_key: os.environ/NIM_API_KEY
  #     stream_timeout: 30.0
  #     timeout: 180.0

  # healthcheck latency of <1.5min
  - model_name: z-ai/glm-5.3
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.3
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  # healthcheck latency of <10sec, but can be flaky
  - model_name: z-ai/glm-5.3-flash
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.3-flash
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0
      timeout: 180.0
 
  # healthcheck latency of <30sec, but can be flaky
  - model_name: nvidia/nemotron-3-ultra-550b-a55b
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NIM_API_KEY
      stream_timeout: 30.0
