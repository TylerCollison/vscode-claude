      api_base: https://api.llm7.io/v1
      api_key: os.environ/LLM7_API_KEY
      stream_timeout: 30.0
      timeout: 180.0

  # --- Nvidia NIM Models ---
  # Note: All of the models from this provider respond rather slowly, but it varies by model
  # Kimi is buggy in this harness; disabling for now
  # - model_name: moonshotai/kimi-k3
  #   litellm_params:
